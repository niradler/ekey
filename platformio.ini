[env:esp32s3_usb_ble]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Build flags for native USB Host mode
; USB CDC disabled because USB port is in host mode
build_unflags = 
    -std=gnu++11
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    ; ESP32 USB Host HID - Arduino port of ESP-IDF USB Host HID
    https://github.com/esp32beans/ESP32_USB_Host_HID.git
    ; NimBLE - BLE stack for ESP32 (smaller and faster than bluedroid)
    h2zero/NimBLE-Arduino@^2.3.7
    ; AsyncWebServer for ESP32
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    ; AsyncTCP for ESP32
    https://github.com/me-no-dev/AsyncTCP.git

lib_ldf_mode = deep

; Board configuration for ESP32-S3 DevKit
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv

; Monitor filters for exception decoding
monitor_filters = esp32_exception_decoder

; SPIFFS filesystem for web files
board_build.filesystem = spiffs
